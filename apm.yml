name: agent-skills
version: 1.0.0
description: >
  Shared agent skills, commands, and instructions for dioad Go projects,
  distributed as an APM package. Install with `apm install github.com/dioad/agent-skills`
  or copy a skill directory straight into a project's (or ~/) .claude/skills/.
author: Pat Downey
# Which agent platforms to deploy to.
# Resolution order: --target flag > this field > auto-detect from filesystem.
# Accepted values: copilot, claude, cursor, opencode, codex, gemini, windsurf, all
targets:
- claude
- copilot
dependencies:
  apm:
  - git: wondelai/skills
    skills:
    - good-strategy-bad-strategy
    - ios-hig-design
    - lean-ux
    - conversion-optimization
    - obviously-awesome
    - refactoring-ui
    - clean-code
    - working-with-legacy-code
    - refactoring-patterns
    - technical-documentation
    - cro-methodology
    - create-website
    - release-it
    - software-design-philosophy
    - improve-code-quality
    - drive-motivation
    - architecture-optimization
    - high-output-management
    - traction-eos
    - mom-test
    - remove-technical-debt
    - team-topologies
    - grow-website
    - design-everyday-things
    - improve-retention
    - lean-analytics
    - microinteractions
    - influence-psychology
    - improve-website
    - crossing-the-chasm
    - pragmatic-programmer
    - jobs-to-be-done
    - steve-jobs-design-review
    - improve-business
    - top-design
    - inspired-product
    - design-sprint
    - predictable-revenue
    - hundred-million-offers
    - ux-heuristics
    - high-perf-browser
    - storybrand-messaging
    - monetizing-innovation
    - grow-app
    - create-business
    - lean-startup
    - contagious
    - web-typography
    - system-design
    - blue-ocean-strategy
    - create-app
    - made-to-stick
    - negotiation
    - ddia-systems
    - 37signals-way
    - clean-architecture
    - domain-driven-design
    - improve-app
    - hooked-ux
    - continuous-discovery
    - cold-start-problem
    - grow-business
